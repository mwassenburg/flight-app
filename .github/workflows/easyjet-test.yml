name: easyJet endpoint test

# Eenmalige test: laat easyJet requests vanaf GitHub Actions toe?
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Vraag AMS-LGW op
        run: |
          python - <<'EOF'
          import requests
          resp = requests.get(
              "https://www.easyjet.com/api/routepricing/v3/searchfares/GetLowestDailyFares",
              params={"departureAirport": "AMS", "arrivalAirport": "LGW", "currency": "EUR"},
              headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                                "(KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36",
                  "Accept": "application/json, text/plain, */*",
                  "Accept-Language": "nl-NL,nl;q=0.9,en;q=0.8",
                  "Referer": "https://www.easyjet.com/nl/",
              },
              timeout=30,
          )
          print("Status:      ", resp.status_code)
          print("Content-Type:", resp.headers.get("content-type"))
          print("Server:      ", resp.headers.get("server"))
          print("Respons (eerste 800 tekens):")
          print(resp.text[:800])
          if resp.status_code != 200:
              print(f"::error title=easyJet weigert de request::HTTP {resp.status_code}")
              raise SystemExit(1)
          EOF
